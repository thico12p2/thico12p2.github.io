<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Obras Públicas RJ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        
        /* Ajuste do Carrossel */
        .swiper { width: 100%; height: 60vh; }
        .swiper-slide {
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        /* Zoom na Foto ao passar o mouse */
        .img-zoom {
            transition: transform 0.5s ease;
        }
        .img-zoom:hover {
            transform: scale(1.1);
        }

        /* Menu de 3 barras (Hambúrguer) */
        .menu-bar {
            width: 25px;
            height: 3px;
            background-color: #333;
            margin: 4px 0;
            transition: 0.4s;
        }
        
        /* Dropdown customizado */
        .dropdown:hover .dropdown-content {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            z-index: 100;
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white fixed w-full z-50 shadow-sm px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold border-l-4 border-blue-600 pl-2">PROJETO OBRAS RJ</div>
        
        <div class="relative dropdown">
            <div class="cursor-pointer p-2">
                <div class="menu-bar"></div>
                <div class="menu-bar"></div>
                <div class="menu-bar"></div>
            </div>
            <div class="dropdown-content mt-2">
                <a href="index.html" class="block px-4 py-3 hover:bg-gray-100">Início</a>
                <a href="analise_custos.html" class="block px-4 py-3 hover:bg-gray-100">Custos</a>
                <a href="analise_prazos.html" class="block px-4 py-3 hover:bg-gray-100">Prazos</a>
                <a href="#desenvolvedores" class="block px-4 py-3 hover:bg-gray-100">Equipe</a>
            </div>
        </div>
    </nav>

    <div class="swiper mySwiper pt-16">
        <div class="swiper-wrapper">
            <div class="swiper-slide" style="background-image: url('fundo_rio1.png');">
                <div class="overlay"></div>
                <div class="relative text-center text-white z-10">
                    <h1 class="text-4xl md:text-6xl font-bold" data-aos="fade-up">Eficiência em Obras</h1>
                </div>
            </div>
            <div class="swiper-slide" style="background-image: url('fundo_rio2.png');">
                <div class="overlay"></div>
                <div class="relative text-center text-white z-10">
                    <h1 class="text-4xl md:text-6xl font-bold">Transparência RJ</h1>
                </div>
            </div>
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <section id="desenvolvedores" class="py-20 bg-white">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-3xl font-bold mb-12">Desenvolvedores</h2>
            <div class="flex flex-wrap justify-center gap-12">
                <div class="max-w-xs" data-aos="zoom-in">
                    <div class="overflow-hidden rounded-full w-40 h-40 mx-auto mb-4 border-4 border-blue-100 shadow-lg">
                        <img src="foto_thiago.png" class="img-zoom w-full h-full object-cover">
                    </div>
                    <h4 class="font-bold text-lg">Thiago Dias</h4>
                    <p class="text-gray-500">Engenharia</p>
                </div>
                <div class="max-w-xs" data-aos="zoom-in" data-aos-delay="200">
                    <div class="overflow-hidden rounded-full w-40 h-40 mx-auto mb-4 border-4 border-blue-100 shadow-lg">
                        <img src="foto_leonardo.png" class="img-zoom w-full h-full object-cover">
                    </div>
                    <h4 class="font-bold text-lg">Leonardo</h4>
                    <p class="text-gray-500">Engenharia</p>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inicializa as animações
        AOS.init({ once: true });

        // Inicializa o carrossel
        const swiper = new Swiper('.mySwiper', {
            loop: true,
            autoplay: { delay: 3000 },
            pagination: { el: '.swiper-pagination', clickable: true },
        });
    </script>
</body>
</html>
